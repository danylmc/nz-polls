<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 744" width="1200" height="744" role="img" aria-labelledby="t d">
<title id="t">Labour and National have lost nearly as much vote as Britain's big two</title>
<desc id="d">Horizontal bar chart of the change in combined vote of each country's two traditional governing parties between the election nearest 2017 and the latest election. Britain fell 24.9 points. New Zealand shows two bars: the 6 October 2026 weighted poll average, down 24.5 points to 56.8%, and the 2023 election, down 16.3 points to 65.0%. Portugal fell 16.3, Denmark 13.8, Austria 10.9, Australia 10.4, Norway 9.7, Germany 8.4, Ireland 7.2, Sweden 0.2. Spain rose 9.0, Canada 13.7 and Greece 18.0.</desc>
