<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 795" width="1200" height="795" role="img" aria-labelledby="t d">
<title id="t">Labour and National have fallen from 81% to 57% of the vote since 2017</title>
<desc id="d">Line chart of the combined vote of each country's two traditional governing parties at elections near 2005, near 2017 and the latest election. New Zealand's Labour plus National vote was 80.2% in 2005, 81.3% in 2017 and 65.0% in 2023, and the 6 October 2026 weighted poll average is 56.8%. The UK fell from 82.3% in 2017 to 57.4% in 2024. Eleven other countries are shown in grey.</desc>
