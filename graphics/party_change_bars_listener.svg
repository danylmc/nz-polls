<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" width="1200" height="848" role="img" aria-labelledby="t d">
<title id="t">National is down 10 points since 2023. Labour has slumped this year, but is still polling above its 2023 election result</title>
<desc id="d">Two bar charts of the change in each party&#x27;s vote, in percentage points: one since the 2023 election result, one since the 1 January 2026 poll average, both measured to the poll average at 9 October 2026. Labour (28.2% now): +1.3 since the election, −5.7 since 1 January. National (27.7% now): −10.4 since the election, −4.5 since 1 January. Green (15.1% now): +3.5 since the election, +5.5 since 1 January. NZ First (10.7% now): +4.6 since the election, +1.0 since 1 January. ACT (9.7% now): +1.1 since the election, +1.8 since 1 January. TOP (6.1% now): +3.9 since the election, +4.3 since 1 January. Te Pāti Māori (1.5% now): −1.6 since the election, −1.2 since 1 January.</desc>
