<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" width="1200" height="848" role="img" aria-labelledby="t d">
<title id="t">National has lost 10 points since the 2023 election, while the Greens, NZ First and TOP have gained</title>
<desc id="d">Bar chart of the change in each party&#x27;s vote since the 2023 election, in percentage points, to the poll average at 14 October 2026. Labour: 26.9% in 2023, 28.1% now (+1.2). National: 38.1% in 2023, 27.5% now (−10.6). Green: 11.6% in 2023, 15.1% now (+3.5). NZ First: 6.1% in 2023, 10.7% now (+4.6). ACT: 8.6% in 2023, 9.8% now (+1.2). TOP: 2.2% in 2023, 6.6% now (+4.4). Te Pāti Māori: 3.1% in 2023, 1.3% now (−1.8).</desc>
