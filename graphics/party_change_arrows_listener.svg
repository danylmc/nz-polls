<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 944" width="1200" height="944" role="img" aria-labelledby="t d">
<title id="t">National is down 10 points since 2023, and Labour has slumped this year</title>
<desc id="d">Arrow chart of party vote. For each party, one arrow runs from the 2023 election result to the current poll average and a second runs from the 1 January 2026 poll average to the current average (9 October 2026). Labour: 28.2% now, +1.3 points since the election (26.9%), −5.7 since 1 January (33.9%). National: 27.7% now, −10.4 points since the election (38.1%), −4.5 since 1 January (32.2%). Green: 15.1% now, +3.5 points since the election (11.6%), +5.5 since 1 January (9.6%). NZ First: 10.7% now, +4.6 points since the election (6.1%), +1.0 since 1 January (9.7%). ACT: 9.7% now, +1.1 points since the election (8.6%), +1.8 since 1 January (7.9%). TOP: 6.1% now, +3.9 points since the election (2.2%), +4.3 since 1 January (1.8%). Te Pāti Māori: 1.5% now, −1.6 points since the election (3.1%), −1.2 since 1 January (2.7%).</desc>
